<!-- print the current page  -->

<!DOCTYPE html>
<html>

<head>
  <title>Print Page</title>
</head>

<body>

  <h1>Hello JavaScript</h1>
  <p>This page can be printed.</p>

  <button onclick="printPage()">Print Page</button>

  <script>
    function printPage() {
      window.print();
    }
  </script>

</body>

</html>
